name: build-image-region-click-test

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/ImageRegionClickTest/**'
      - '.github/workflows/build-image-region-click-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/ImageRegionClickTest/**'
      - '.github/workflows/build-image-region-click-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish tools/ImageRegionClickTest/ImageRegionClickTest.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true
          Get-ChildItem dist | Format-Table Name,Length
      - name: Keep only the EXE artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item dist/ThanLong_ImageRegionClickTest.exe artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLong-ImageRegionClickTest-v0.1.0-win-x64
          path: artifact/ThanLong_ImageRegionClickTest.exe
          if-no-files-found: error
